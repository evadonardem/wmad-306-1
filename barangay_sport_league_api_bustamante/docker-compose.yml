services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    tmpfs:
      - /tmp
    user: "1000:1000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    command: >
      sh -c "if [ ! -d vendor ]; then composer install --no-interaction; fi && if [ ! -f .env ]; then cp .env.example .env; fi && if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi && php artisan migrate --force && php-fpm"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t && php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s ? 0 : 1);'"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/var/www/html:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    volumes:
      - ./docker/scripts/mysql-entrypoint.sh:/usr/local/bin/docker-entrypoint-with-db.sh:ro
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
