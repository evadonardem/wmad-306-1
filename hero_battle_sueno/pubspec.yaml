name: hero_battle
description: "A simple hero battle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  sqflite: ^2.4.2
  shared_preferences: ^2.2.3
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  path: ^1.9.1
  flutter_animate: ^4.5.0
  http: ^1.2.0   # ✅ THIS is the only thing you needed to add
  slugify: ^2.0.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/