name: hero_battle_teligo
description: Hero Battle Flutter App - Allen Ray Teligo

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.0
  cached_network_image: ^3.3.1

  # Persistence
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3
  path: ^1.9.0

  # UI
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true