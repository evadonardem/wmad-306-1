name: hero_battle
description: "A simple hero battle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  sqlite3: ^3.3.1
  sqlite3_flutter_libs: ^0.5.39
  shared_preferences: ^2.5.5
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.3.2
  palette_generator: ^0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
