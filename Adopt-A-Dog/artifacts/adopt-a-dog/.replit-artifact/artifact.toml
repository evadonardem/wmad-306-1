kind = "mobile"
previewPath = "/"
title = "Adopt-a-Dog"
version = "1.0.0"
id = "artifacts/adopt-a-dog"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22719

[services.development]
run = "pnpm --filter @workspace/adopt-a-dog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adopt-a-dog", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/adopt-a-dog", "run", "serve" ]

[services.env]
PORT = "22719"
BASE_PATH = "/"
